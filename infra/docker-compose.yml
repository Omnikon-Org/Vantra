version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vantra_postgres
    environment:
      POSTGRES_USER: vantra
      POSTGRES_PASSWORD: vantra_dev_password
      POSTGRES_DB: vantra
    ports:
      - "5434:5432"
    volumes:
      - vantra_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  vantra_pg_data:
